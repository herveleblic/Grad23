<style>
  .card.clickable { cursor: pointer; position: relative; overflow: hidden; }
  .card.clickable img { transition: opacity 0.3s; }
  .card.clickable .overlay-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    aspect-ratio: 1 / 1;
    object-fit: cover;
    opacity: 0;
    transition: opacity 0.4s;
    pointer-events: none;
  }
  .card.clickable.revealed .overlay-img { opacity: 1; }
  .card.clickable.revealed > img { opacity: 0; }
</style>

<script>
  const allImages = [
    "soil.gif", "soil2.gif", "pot.gif",
    "oct1.jpeg", "oct2.jpeg", "oct3.jpeg", "oct7.jpeg",
    "sept1.jpeg", "fukuoka.jpg", "Old.jpeg",
    "larmedejob.jpeg", "amarante.jpeg",
    "Amarante tête d'éléphant.png", "Fève d'Aguadulce.png",
    "Amarante Queue de renard rouge.png", "Lin Bleu (engrais vert).png",
    "Chou kale.png", "Pois à rames mangetout.png",
    "Chervis.png", "Myosotis.png", "Armoise annuelle.png",
    "Côte de bette à cardes rouges.png"
  ];

  document.querySelectorAll('.card.clickable').forEach(card => {
    const overlay = document.createElement('img');
    overlay.className = 'overlay-img';
    card.appendChild(overlay);

    card.addEventListener('click', () => {
      const current = card.querySelector('img:not(.overlay-img)').src.split('/').pop();
      let pick;
      do { pick = allImages[Math.floor(Math.random() * allImages.length)]; }
      while (pick === decodeURIComponent(current));

      overlay.src = pick;
      card.classList.toggle('revealed');
      card.querySelector('figcaption').textContent = card.classList.contains('revealed')
        ? pick.replace(/\.[^.]+$/, '') : 'Cliquez pour révéler';
    });
  });
</script>
